<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title | default: "Recipies" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-ornament">✦</div>
      <h1 class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title | default: "Recipies" }}</a>
      </h1>
      <div class="header-rule"><span></span></div>
      <p class="site-tagline">A Collection of Family Recipes</p>
    </div>
  </header>

  <main class="page-content">
    <div class="content-wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-ornament">&mdash; ✦ &mdash;</div>
    <p>Bon App&eacute;tit</p>
  </footer>
</body>
</html>
